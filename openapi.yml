      type: string
      description: How the classroom session was created
      enum:
        - ADHOC
        - SCHEDULE
      example: SCHEDULE
    CreateClassroomSessionAdhocCommand:
      type: object
      description: >
        Command to create an adhoc classroom session. Status is always OPEN and type is always ADHOC.

      additionalProperties: false
      required:
        - sessionDate
        - startTime
        - endTime
      properties:
        sessionDate:
          type: string
          format: date
