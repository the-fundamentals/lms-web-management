          example: "2026-07-19"
        startTime:
          type: string
          format: time-local
          description: Session start time
          example: "09:00:00"
        endTime:
          type: string
          format: time-local
          description: Session end time
          example: "10:30:00"
        name:
          type: string
          description: Optional display name of the classroom session
          minLength: 1
          maxLength: 255
          example: Week 1 lecture
        description:
          type: string
          description: Optional description of the classroom session
          minLength: 1
          maxLength: 2000
          example: Introduction to the course and classroom expectations
    UpdateClassroomSessionCommand:
      type: object
      description: >
        Command to update a classroom session's display name and description. Date, times, status, and type cannot be changed here.

      additionalProperties: false
