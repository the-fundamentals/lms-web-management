    CreateClassroomScheduleRecurrenceCommand:
      type: object
      description: >
        Command to create classroom schedule recurrences — one persisted row per weekday in `byDays`

      additionalProperties: false
      required:
        - frequency
        - byDays
        - recurrenceStartDate
        - startTime
        - endTime
      properties:
        frequency:
          $ref: "#/components/schemas/RecurrenceFrequency"
        byDays:
          type: array
          description: Weekdays to create a recurrence for (one row each)
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RecurrenceByDay"
          example:
            - MONDAY
            - WEDNESDAY
        recurrenceStartDate:
          type: string
          format: date
          description: Calendar date when the recurrence begins
          example: "2026-07-20"
        recurUntil:
          type: string
          format: date
          description: Inclusive last calendar date of the recurrence; omit for no end
          example: "2026-12-31"
        startTime:
          type: string
          format: time-local
          description: Daily start time of the scheduled session
          example: "09:00:00"
        endTime:
          type: string
          format: time-local
          description: Daily end time of the scheduled session
          example: "10:30:00"
        name:
          type: string
          description: Optional display name copied onto generated classroom sessions
          minLength: 1
          maxLength: 255
          example: Week 1 lecture
        description:
          type: string
          description: Optional description copied onto generated classroom sessions
          minLength: 1
          maxLength: 2000
          example: Introduction to the course and classroom expectations
    RecurrenceFrequency:
      type: string
      description: How often the recurrence repeats
      enum:
        - WEEKLY
      example: WEEKLY
    RecurrenceByDay:
      type: string
      description: Weekday the recurrence falls on
      enum:
        - MONDAY
        - TUESDAY
        - WEDNESDAY
        - THURSDAY
        - FRIDAY
        - SATURDAY
        - SUNDAY
      example: MONDAY
    ClassroomScheduleRecurrenceResponse:
      type: object
      description: Classroom schedule recurrence resource returned by the API
      additionalProperties: false
      required:
        - id
        - classroomId
        - frequency
        - byDay
        - recurrenceStartDate
        - startTime
        - endTime
        - createdDate
        - lastModifiedDate
      properties:
        id:
          type: string
          format: uuid
          description: Unique classroom schedule identifier
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        classroomId:
          type: string
          format: uuid
          description: Classroom this schedule belongs to
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        frequency:
          $ref: "#/components/schemas/RecurrenceFrequency"
        byDay:
          $ref: "#/components/schemas/RecurrenceByDay"
        recurrenceStartDate:
          type: string
          format: date
          description: Calendar date when the recurrence begins
          example: "2026-07-20"
        recurUntil:
          type: string
          format: date
          description: Inclusive last calendar date of the recurrence; null if none
          example: "2026-12-31"
        startTime:
          type: string
          format: time-local
          description: Daily start time of the scheduled session
          example: "09:00:00"
        endTime:
          type: string
          format: time-local
          description: Daily end time of the scheduled session
          example: "10:30:00"
        name:
          type: string
          description: Optional display name copied onto generated classroom sessions
          minLength: 1
          maxLength: 255
          example: Week 1 lecture
        description:
          type: string
          description: Optional description copied onto generated classroom sessions
          minLength: 1
          maxLength: 2000
          example: Introduction to the course and classroom expectations
        deletedDate:
          type: string
          format: date-time
          description: When the schedule was soft-deleted (null if active)
          example: null
        createdDate:
          type: string
          format: date-time
          description: When the schedule was created
          example: 2026-07-14T00:00:00Z
        lastModifiedDate:
          type: string
          format: date-time
          description: When the schedule was last modified
          example: 2026-07-14T00:00:00Z
    GetAllClassroomScheduleRecurrencesResponse:
      type: array
